cartesian_pose_controller:
  joints:
    type: string_array
    default_value: []
    description: Names of joints used by the controller
    validation:
      unique<>: null
  end_effector_frame:
    type: string
    default_value: "flange"
    description: "Name of the end effector frame to be controlled."

  topic_prefix:
    type: string
    default_value: ""
    description: "Prefix for the published end_effector_pose and end_effector_twist topics. If empty, the controller name is used."
  target_subscription_topic:
    type: string
    default_value: "target_pose_twist"
    description: "Name of the topic to subscribe to for target pose and twist commands."
  topic_pub_frequency:
    type: double
    default_value: 10.0
    description: "Frequency of the published end_effector_pose and end_effector_twist topics. Zero disables publishing."
    validation:
      bounds<>: [0.0,1000.0]

  ik_error_avoidance_weight:
    type: double
    default_value: 10.0
    description: "Weight for the result error avoidance criteria in the inverse kinematics solver."
    validation:
      bounds<>: [0.001, 1000.0]
  ik_precision:
    type: double
    default_value: 1.0e-3
    description: "Precision of the inverse kinematics solver."
    validation:
      bounds<>: [0.0, 0.1]
  ik_max_iterations:
    type: int
    default_value: 1000
    description: "Maximum number of iterations for the inverse kinematics solver."
    validation:
      bounds<>: [1, 10000]
  
  enable_introspection:
    type: bool
    default_value: false
    description: "If true, enables ros2control introspection for internal state monitoring."
  enable_debug_log:
    type: bool
    default_value: false
    description: "If true, enables debug logging for the entire controller. This will flood your console!"
  dry_run:
    type: bool
    default_value: false
    description: "If true, the controller will not send commands to the robot."





  enable_state_topic:
    type: bool
    default_value: true
    description: "Publish a status message on the ~/state topic"

  srdf:
    type: string
    default_value: ""
    description: "The full srdf"

  
  base_frame:
    type: string
    default_value: "base"
    description: "Name of the base frame"
  interpolation_time:
    type: double
    default_value: 0.1
    description: "Interpolation time between joint target commands"
    validation:
      bounds<>: [0.0,2.0]
