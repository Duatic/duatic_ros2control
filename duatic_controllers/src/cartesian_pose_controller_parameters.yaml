cartesian_pose_controller:
  joints:
    type: string_array
    default_value: []
    description: Names of joints used by the controller
    validation:
      unique<>: null
  control_frame:
    type: string
    default_value: "flange"
    description: "Name of the frame to be controlled."  
  
  
  enable_state_topic:
    type: bool
    default_value: true
    description: "Publish a status message on the ~/state topic"

  srdf:
    type: string
    default_value: ""
    description: "The full srdf"

  
  base_frame:
    type: string
    default_value: "base"
    description: "Name of the base frame"
  interpolation_time:
    type: double
    default_value: 0.1
    description: "Interpolation time between joint target commands"
    validation:
      bounds<>: [0.0,2.0]
