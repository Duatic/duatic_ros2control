cartesian_pose_controller:
  joints:
    type: string_array
    default_value: []
    description: Names of joints used by the controller
    validation:
      unique<>: null
  end_effector_frame:
    type: string
    default_value: "flange"
    description: "Name of the end effector frame to be controlled."

  topic_prefix:
    type: string
    default_value: ""
    description: "Prefix for the published end_effector_pose and end_effector_twist topics. If empty, the controller name is used."
  topic_frequency:
    type: double
    default_value: 10.0
    description: "Frequency of the published end_effector_pose and end_effector_twist topics. Zero disables publishing."
    validation:
      bounds<>: [0.0,1000.0]

  dry_run:
    type: bool
    default_value: false
    description: "If true, the controller will not send commands to the robot."





  enable_state_topic:
    type: bool
    default_value: true
    description: "Publish a status message on the ~/state topic"

  srdf:
    type: string
    default_value: ""
    description: "The full srdf"

  
  base_frame:
    type: string
    default_value: "base"
    description: "Name of the base frame"
  interpolation_time:
    type: double
    default_value: 0.1
    description: "Interpolation time between joint target commands"
    validation:
      bounds<>: [0.0,2.0]
