cartesian_pose_controller:
  joints:
    type: string_array
    default_value: []
    description: Names of joints used by the controller
    validation:
      unique<>: null
  base_frame:
    type: string
    default_value: "base_link"
    description: "Name of the base frame"
  target_frame:
    type: string
    default_value: "flange"
    description: "Name of the end effector frame to be controlled."
  limit_frames:
    type: string_array
    default_value: []
    description: "Additional frames that are limited in motion."
    validation:
      unique<>: null

  motion_horizon:
    type: double
    default_value: 0.1
    description: "Time horizon in seconds the IK algorithm is running in. This will create exponential boundary approximation, the bigger, the slower"
    validation:
      bounds<>: [0.001, 1.0]
  linear_velocity_limit:
    type: double
    default_value: 1.0
    description: "Maximum velocity for linear, Cartesian motions. Set zero to disable velocity limits."
    validation:
      bounds<>: [0.0, 10.0]
  angular_velocity_limit:
    type: double
    default_value: 0.0
    description: "Maximum velocity for rotational motions. Set zero to synchronize with linear velocities"
    validation:
      bounds<>: [0.0, 62.83]

  topic_prefix:
    type: string
    default_value: ""
    description: "Prefix to all topics. If empty, the controller name is used."
  target_topic_suffix:
    type: string
    default_value: "target"
    description: "Suffix added to the target frame topic for receiving control inputs."
  topic_pub_frequency:
    type: double
    default_value: 10.0
    description: "Frequency of the published end_effector_pose and end_effector_twist topics. Zero disables publishing."
    validation:
      bounds<>: [0.0,1000.0]

  ik_damping:
    type: double
    default_value: 0.001
    description: "Weight to dampen all joint motions and stabilize the IK solution."
    validation:
      bounds<>: [0.000001, 1.0]
  ik_precision:
    type: double
    default_value: 0.0001
    description: "Precision of the inverse kinematics solver."
    validation:
      bounds<>: [0.000001, 0.1]
  ik_max_iterations:
    type: int
    default_value: 10
    description: "Maximum number of iterations for the inverse kinematics solver."
    validation:
      bounds<>: [3, 30]
  
  enable_introspection:
    type: bool
    default_value: false
    description: "If true, enables ros2control introspection for internal state monitoring."
  enable_debug_log:
    type: bool
    default_value: false
    description: "If true, enables debug logging for the entire controller. This will flood your console!"
  dry_run:
    type: bool
    default_value: false
    description: "If true, the controller will not send commands to the robot."
