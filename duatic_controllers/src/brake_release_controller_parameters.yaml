brake_release_controller:
  joints:
    type: string_array
    default_value: []
    description: Names of joints used by the controller
    validation:
      unique<>: null
  probe_velocity:
    type: double
    default_value: 0.6
    description: "Speed of the position target in 'auto' mode in [rad/s], which also sets how fast the torque grows while a joint is blocked"
    validation:
      gt<>: [0.0]
  max_torque:
    type: double
    default_value: 3.0
    description: "Largest measured drive torque in 'auto' mode in [Nm], including the torque of other controllers. Both directions are tried with a quarter, a half and then the full value"
    validation:
      gt<>: [0.0]
  mode:
    type: string
    default_value: "auto"
    description: "Select between 'auto', 'manual' mode for brake release. In manual the user has a certain amount of time to manually move all drives around."
    read_only: true
    validation:
      one_of<>: [["auto", "manual"]]
  timeout:
    type: double
    default_value: 50.0
    description: "Timeout in 'manual' mode until the brakes are put into mode 'hold' in [s]"
    validation:
      gt_eq<>: [0.0]
