name: Edge

on:
  push:
    branches: [main]

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge:
    permissions:
      contents: read
      actions: read
    uses: Duatic/ci-workflows/.github/workflows/reusable_edge_build.yml@v2
    with:
      runner: ubuntu-latest
    secrets: inherit
